type: custom:bubble-card
card_type: pop-up
hash: "#ac"
name: Эмби Лампа
icon: hue:bollard
margin_top_mobile: auto
margin_top_desktop: auto
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
show_header: false
close_by_clicking_outside: false
backdrop_blur: "5"
bg_blur: "100"
bg_opacity: "50"
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    background: rgba(255, 255, 255, 0.1); 
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Кондиционер
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: mdi:air-conditioner
      - type: spacer
      - type: template
        entity: climate.ac_fan
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: fan.ac_switch
        tap_action:
          action: toggle
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: mdi:power
        icon_color: |2-
            {% if is_state('fan.ac_switch', 'on')%} 
               {% if is_state('climate.ac_fan','cool')%} blue
               {% elif is_state('climate.ac_fan','heat')%} red
               {% elif is_state('climate.ac_fan','on')%} indigo
               {% endif %}
            {% else %} 1
            {% endif %}
        card_mod:
          style:
            .: |
              {% set scale = '1' %}
              {% set hover = 'true' %}
              {% set stating = 'true' %}
              {% set state_on = 'on' %}
              {% set color = 'rgba(120,120,120,0.2)' %}
              {% set hover_color_off = 'rgba(120,120,120,0.3) !important' %}
              {% include 'chip_settings_style.jinja' %}
    alignment: center
    card_mod:
      style:
        .: |
          ha-card {
             --chip-background: none !important;
             --chip-border-radius: 1000px;
             zoom: 6;
             #--chip-height: 200px;
             --chip-spacing: {{chip_spacing|default(0)}}px;
             margin: 2px;
             }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: fan.ac_switch
            state: "on"
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: climate.ac_fan
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:snowflake
          color: |-
            {% if is_state(entity, 'cool')%} white
            {% else %} disabled
            {% endif %}
          tap_action:
            action: perform-action
            perform_action: climate.set_hvac_mode
            target:
              entity_id: climate.ac_fan
            data:
              hvac_mode: cool
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: fan.ac_switch
            state: "on"
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: climate.ac_fan
          grid_options:
            columns: 12
            rows: auto
          icon: mdi:fire
          color: |-
            {% if is_state(entity, 'heat')%} white
            {% else %} disabled
            {% endif %}
          tap_action:
            action: perform-action
            perform_action: climate.set_hvac_mode
            target:
              entity_id: climate.ac_fan
            data:
              hvac_mode: heat
          vertical: true
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.ble_temperature_a4c1387e6730
            state_not: unavailable
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: sensor.ble_temperature_a4c1387e6730
          grid_options:
            columns: 12
            rows: auto
          tap_action:
            action: more-info
          vertical: true
          icon_tap_action:
            action: none
          primary: >-
            {% if is_state(config.entity, 'unavailable') %} -° 

            {% else %} {{states(config.entity)|float(0) | round(1)|
            replace(".",",")}}°  

            {% endif %}
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: automation.konditsioner_vkl_vykl_temp
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:fan-auto
        color: |-
          {% if is_state('automation.konditsioner_vkl_vykl_temp', 'on')%} white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: toggle
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: sensor.ac_fan_mode
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:fan-auto
        color: |-
          {% if is_state('sensor.ac_fan_mode', 'auto') %} white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: climate.set_fan_mode
          target:
            entity_id: climate.ac_fan
          data:
            fan_mode: auto
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: sensor.ac_fan_mode
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:fan-speed-1
        color: |-
          {% if is_state('sensor.ac_fan_mode', 'low') %} white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: climate.set_fan_mode
          target:
            entity_id: climate.ac_fan
          data:
            fan_mode: low
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: sensor.ac_fan_mode
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:fan-speed-2
        color: |-
          {% if is_state('sensor.ac_fan_mode', 'mid') %} white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: climate.set_fan_mode
          target:
            entity_id: climate.ac_fan
          data:
            fan_mode: mid
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: sensor.ac_fan_mode
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:fan-speed-3
        color: |-
          {% if is_state('sensor.ac_fan_mode', 'high') %} white
          {% else %} disabled
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: climate.set_fan_mode
          target:
            entity_id: climate.ac_fan
          data:
            fan_mode: high
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
    visibility:
      - condition: state
        entity: fan.ac_switch
        state: "on"
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
popup_mode: default
card_layout: large
slide_to_close_distance: "500"
